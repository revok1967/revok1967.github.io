body {
	background: url('ALIEN6.jpg') no-repeat fixed center / cover;

header {
	display: flex;
	align-items: center;
	background-color: black;
 	border: 4px solid white;
	padding: 5px 
}
#nav-title {
	margin-left: 7px;
	margin-right: auto;
	font-size: 1.5em;
	font-family: "Share Tech Mono", system-ui;	
	color: lime;
	font-weight: bold;
}
header li {
	list-style: none;
	display: inline-block;
	padding: 0 20px;
}
header a:link,a:visited {
	text-decoration: none;
	font-family: "Share Tech Mono", system-ui;

header a:hover, a:active {

div.padre {
 	background-color: GoldenRod;

}
div.alien {
	background-color:black;
	color:lime;
	font-weight:bold;
	font-family: "Share Tech Mono", monotype;
	border: 3px solid white;
	padding: 5px;
	display: inline-block;
}
div.neonbox {
      /* Dark background is essential for contrast */
  background: #000;
  
  /* Optional: Add a subtle border to define the "tube" */
  border: 2px solid #00e5ff;
  
  /* The Neon Glow Layers */
  box-shadow:
    /* 1. Inner white core (simulates hot center) */
    0 0 5px #fff,
    /* 2. Tight colored glow */
    0 0 10px #00e5ff,
    /* 3. Medium colored glow */
    0 0 20px #00e5ff,
    /* 4. Wide bloom */
    0 0 40px #00e5ff,
    /* 5. Very wide, low opacity bloom */
    0 0 80px rgba(0, 229, 255, 0.5);
}
footer {
  	background-color: black;
	color: lime;
	border: 4px solid white;
	padding: 15px; 
	text-align: center;
}
